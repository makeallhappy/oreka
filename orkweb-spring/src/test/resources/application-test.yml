# 测试环境配置:H2 内存库,不碰真实 oreka MySQL
spring:
  datasource:
    url: jdbc:h2:mem:oreka_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # 测试库随便建删
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

orkweb:
  jwt:
    secret: test-secret-key-for-contract-tests-32bytes-min
  audio-output-path: /tmp/orkaudio-test

logging:
  level:
    net.sf.oreka: DEBUG
