# oreka docker-compose.yml —— 改写版(2026-10-21)
# 变更: mysql 独立到自定义网络,显式关闭 IPv6。
#   原因: oreka_default 默认 bridge 网络产生的 veth 带 link-local IPv6 地址
#   (fe80::680f:53ff:feec:b37d),导致 SIPREC 系统的 rtpengine 启动时
#   libwebsockets 枚举接口崩溃。改用 enable_ipv6:false 的网络根治。
# 数据: mysql 数据在 oreka_mysql_data volume,重建容器不丢。

services:
  mysql:
    image: mysql:8.0
    container_name: oreka-mysql
    environment:
      MYSQL_ROOT_PASSWORD: oreka123
      MYSQL_DATABASE: oreka
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"   # 发布到宿主机回环,SIPREC(host 网络)需连 127.0.0.1:3306
    networks:
      - mysql_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-poreka123"]
      interval: 5s
      timeout: 5s
      retries: 20

  # orkaudio 用 host 网络抓包,保持原样
  orkaudio:
    image: oreka-orkaudio:latest
    container_name: oreka-orkaudio
    build:
      context: ./
      dockerfile: Dockerfile.orkaudio
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./docker-config/orkaudio-config.xml:/etc/orkaudio/config.xml:ro
      - orkaudio_logs:/var/log/orkaudio
    depends_on:
      - mysql

networks:
  mysql_net:
    driver: bridge
    enable_ipv6: false   # 关键:关闭 IPv6,避免产生干扰 rtpengine 的 veth

volumes:
  mysql_data:
  orkweb_logs:
  orkaudio_logs:
